<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1180 610" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">Daniel — premium animated developer profile</title>
  <desc id="description">Animated violet glass terminal with an ASCII portrait, developer information, and skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfaff"/><stop offset=".5" stop-color="#f8f5ff"/><stop offset="1" stop-color="#f4f7ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d28d9"/><stop offset=".5" stop-color="#a21caf"/><stop offset="1" stop-color="#0891b2"/><animate attributeName="x1" values="-.45;1;-.45" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values=".55;2;.55" dur="8s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="ascii" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset=".46" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/><animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/><animate attributeName="y1" values="0;.8;0" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/></linearGradient>
